# .github/workflows/snake.yml  →  patří do repo dyntr/dyntr
# Generuje animovaný "contribution snake" SVG do větve `output` (na ni odkazuje profilové README).
name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"   # každý den ve 3:00 UTC
  workflow_dispatch:        # + ruční spuštění
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: dyntr
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=7C5CFF&color_dots=161b22,7C5CFF,9E7BFF,B69CFF,ffffff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
