# Generuje contribution snake (dark + light) do větve `output`.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: dyntr
          outputs: |
            dist/github-snake.svg?color_snake=7C5CFF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=7C5CFF&color_dots=161b22,7C5CFF,9E7BFF,B69CFF,ffffff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
